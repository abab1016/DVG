version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dvg-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management-UI (http://localhost:15672, admin/admin)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
